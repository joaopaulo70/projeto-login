<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="estilos/style.css">
    <link rel="stylesheet" href="estilos/media-queries.css">
</head>
<body>
    <main>
        <section id="login">
            <div id="imagem">
                <!-- Aqui vai a imagem nas css -->
            </div>
            <div id="formulario">
                <h1>Login</h1>
                <p>Seja bem-vindo(a) novamente. Faça login para acessar sua conta e poder fazer as configurações no seu ambiente.</p>
                <form action="login.php" method="post">
                    <div class="campo">
                        <label for="ilogin">login</label>
                        <input type="email" name="login" id="ilogin" placeholder="seu email" required>
                    </div>
                    <div class="campo">
                        <label for="isenha">senha</label>
                        <input type="password" name="senha" id="isenha" placeholder="sua senha" required minlength="8">

                    </div>
                </form>

            </div>
        </section>
    </main>
</body>
</html>
